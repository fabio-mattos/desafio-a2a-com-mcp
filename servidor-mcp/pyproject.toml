[project]
name = "servidor-mcp"
version = "1.0.0"
description = "Servidor MCP (Streamable HTTP) da Central de Salas da Hill Valley Tech."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.2.0",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "dominio"]
